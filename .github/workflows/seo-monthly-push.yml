# Daily check → push due SEO articles → WordPress → Telegram.
# Cron: every day 10:00 AM Malaysia (UTC+8) = 02:00 UTC
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   WP_APP_USER, WP_APP_PASSWORD, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Without these, the job fails silently from your view — Telegram will warn if bot secrets exist.
name: SEO Auto Push

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check required secrets
        env:
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=0
          for key in WP_APP_USER WP_APP_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            eval "val=\$$key"
            if [ -z "$val" ]; then
              echo "::error::$key is empty — add it in GitHub → Settings → Secrets → Actions"
              missing=1
            else
              echo "$key=set"
            fi
          done
          if [ "$missing" = "1" ]; then
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"❌ 100cuci.ad SEO auto-push failed\\nGitHub Secrets incomplete (WP_APP_USER / WP_APP_PASSWORD).\\nLocal PC scheduler may still work.\"}" || true
            fi
            exit 1
          fi

      - name: Check and push the due article slot
        env:
          NEXT_PUBLIC_SITE_URL: https://www.100cuci.ad
          WP_REST_URL: https://cms.100cuci.ad/wp-json
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Kuala_Lumpur
        run: node scripts/seo-auto-update.mjs

      - name: Save topic log and retry queue
        if: success()
        run: |
          git config user.name "100cuci seo"
          git config user.email "seo@100cuci.ad"
          git add content/seo-topic-log.json content/seo-queued-retry.json
          if git diff --cached --quiet; then
            echo "no log changes"
            exit 0
          fi
          git commit -m "Record SEO auto-update topic log"
          git push

      - name: Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "No Telegram secrets — skip failure notify"
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"❌ 100cuci.ad SEO auto-push FAILED\\nCheck GitHub Actions logs.\"}" || true
